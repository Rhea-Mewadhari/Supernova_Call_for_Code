  .chat-input button:hover {
    background: gainsboro;

   function generateSessionId() {
        const now = new Date();
        const timestamp = now.getFullYear().toString() +
            ('0' + (now.getMonth() + 1)).slice(-2) + // Months are zero-based
            ('0' + now.getDate()).slice(-2) +
            ('0' + now.getHours()).slice(-2) +
            ('0' + now.getMinutes()).slice(-2) +
            ('0' + now.getSeconds()).slice(-2) +
            ('00' + now.getMilliseconds()).slice(-3).substring(0, 3); // Get first 3 digits of milliseconds

        // Generate a random 6-digit number
        const randomNum = Math.floor(100000 + Math.random() * 900000); // Generates a number between 100000 and 999999

        return `${timestamp}${randomNum}`;
    }
    

    // Global sessionId to ensure it persists across functions
    if (!localStorage.getItem('sessionId')) {
    // Generate and store a new sessionId if it does not exist
    localStorage.setItem('sessionId', generateSessionId());
}

// Function to generate downloadable chat history
function createDownload() {
    const downloadLines = [createDownloadText('From', 'Message')];

    messages.forEach(message => {
        if (message.input?.text) {
            // User's message
            downloadLines.push(createDownloadText('You', message.input.text));
        } else if (message.output?.generic?.length) {
            // Assistant's message
            message.output?.generic.forEach(messageItem => {
                if (messageItem?.text) {
                    downloadLines.push(createDownloadText('Lendyr', messageItem.text));
                }
            });
        }
    });

    return downloadLines.join('\n');
}

async function sendLabelToChatbot(event) {
    event.preventDefault();

    const sendButton = document.getElementById('sendLabelButton');
    sendButton.innerText = 'Sending...';
    sendButton.classList.add('btn-sending');

    try {
        const resultDiv = document.getElementById('result');

        if (label) {
            const sessionId = getSessionId();

            // 1. Show label as user's message
            const userInput = document.getElementById('userInput');
            userInput.value = label;

            // 2. Trigger the flow like a real message
            sendMessage();

            // 3. Send to backend (optional: useful for logging)
            const response = await fetch('/custom-chatbot/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    session_id: sessionId,
                    label: label
                })
            });

            const data = await response.json();
            if (response.ok && data.response) {
                console.log('Logged label to server:', data.response);
            }

        } else {
            console.error('Label not found.');
        }
    } catch (error) {
        console.error('Error sending label to chatbot:', error);
    } finally {
        sendButton.innerText = 'Send Label to Chatbot';
        sendButton.classList.remove('btn-sending');
    }
}

                // Sort predictions by confidence

                    resultHTML += `<li>${prediction.label} - ${(prediction.confidence * 100).toFixed(2)}%</li>`;

function appendMessage(text, className) {
  const chatBox = document.getElementById('chatBox');

  const createAndShowMessage = () => {
    const msg = document.createElement('div');
    msg.className = 'message ' + className;
    msg.innerHTML = text.replace(/\n/g, '<br>');
    chatBox.appendChild(msg);

    // 🔄 Save to history (bot or user)
    if (className.includes('user-message')) {
      customMessages.push({ from: 'You', message: text });
    } else if (className.includes('bot-message')) {
      customMessages.push({ from: 'Assistant', message: text });
    }

    // Animate
    setTimeout(() => {
      msg.classList.add('show');
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 10);
  };

  if (className.includes('bot-message')) {
    setTimeout(() => createAndShowMessage(), 600);
  } else {
    createAndShowMessage();
  }
}

//flow runner



function runFlowStep(flow, stepKey) {
  const step = flow[stepKey];
  appendMessage(step.message, 'bot-message');

  const container = document.getElementById('dynamicOptions');
  container.innerHTML = '';
  container.style.display = 'flex';

  document.getElementById('userInput').disabled = true;

  step.options.forEach(option => {
    const btn = document.createElement('button');
    btn.textContent = option;

    btn.onclick = function () {
      appendMessage(option, 'user-message');

      // Run custom onAnswer logic if available
      if (typeof step.onAnswer === 'function') {
        step.onAnswer(option, flowState);
      }

      container.style.display = 'none';
      document.getElementById('userInput').disabled = false;

      // Safely determine the next step
      let nextStepKey = step.next;

      if (nextStepKey && typeof nextStepKey === 'object') {
        nextStepKey = nextStepKey[option]; // Dynamic branch
      }

      if (nextStepKey && flow[nextStepKey]) {
        runFlowStep(flow, nextStepKey);
      } else {
        appendMessage("Thanks. Assessment complete.", 'bot-message');
        console.log("Flow state:", flowState); // Final state debug

        showDiagnosisResult(flowState, activeFlowName);

      }
    };

    container.appendChild(btn);
  });
}

    function showDiagnosisResult(flowState, conditionName) {
      const { mild, moderate, severe } = flowState;
    
      let severity = '';
    
      if (severe >= moderate && severe >= mild) {
        severity = 'severe';
      } else if (moderate >= mild) {
        severity = 'moderate';
      } else {
        severity = 'mild';
      }
    
      const condition = diagnosisDatabase[conditionName];
    
      if (condition && condition[severity]) {
        const { recommendation } = condition[severity];
    
        // Format recommendation line by line
        const sentences = recommendation.split('. ').map(sentence => sentence.trim()).filter(sentence => sentence.length > 0);
        const formattedRecommendation = sentences.map(sentence => `- ${sentence}.`).join('\n');
    
        // Create one big message
        const fullMessage = 
          `🩺 Diagnosis: ${condition.name}\n` +
          `⚡ Severity: ${severity.toUpperCase()}\n\n` +
          `📝 Treatment Recommendations:\n${formattedRecommendation}`;
    
        // Send as one message
        appendMessage(fullMessage, 'bot-message');

        appendMessage("Do you have any additional questions?", 'bot-message');
        showYesNoOptionsForLLM();

      } else {
        appendMessage("Diagnosis information not available.", 'bot-message');
      }
    }  


    function showYesNoOptionsForLLM() {
      const container = document.getElementById('dynamicOptions');
      container.innerHTML = '';
      container.style.display = 'flex';
    
      const yesBtn = document.createElement('button');
      yesBtn.textContent = 'Yes';
      yesBtn.onclick = () => {
        container.style.display = 'none';
        askUserForLLMQuestion();
      };
    
      const noBtn = document.createElement('button');
      noBtn.textContent = 'No';
      noBtn.onclick = () => {
        container.style.display = 'none';
        appendMessage("Okay! Let me know if you need anything else.", 'bot-message');
      };
    
      container.appendChild(yesBtn);
      container.appendChild(noBtn);
    }

    function askUserForLLMQuestion() {
      inLLMQuestionMode = true;
      appendMessage("Please type your question below:", 'bot-message');
    
      document.getElementById('userInput').disabled = false;
    
      const listener = function (event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          const userInput = document.getElementById('userInput');
          const question = userInput.value.trim();
          userInput.value = '';
          userInput.removeEventListener('keydown', listener);
    
          if (question !== '') {
            appendMessage(question, 'user-message');
            callLLM(question);
            inLLMQuestionMode = false;
          }
        }
      };
    
      document.getElementById('userInput').addEventListener('keydown', listener);
    }

    function callLLM(question) {
      showTypingIndicator(); 
      
      fetch("/ask", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          // Add CSRF token if using Flask-WTF
          "X-CSRFToken": document.querySelector('meta[name="csrf-token"]')?.content
        },
        body: JSON.stringify({ 
          question,
          session_id: getSessionId()
        })
      })
      .then(res => {
        // Log response status
        console.log('LLM API Response Status:', res.status);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        return res.json();
      })
      .then(data => {
        removeTypingIndicator();
        console.log('LLM API Response:', data);

        if (!data || !data.answer) {
          throw new Error('Invalid response data');
        }

        // Show the main answer
        const answer = data.answer;
        if (answer.toLowerCase().includes("i do not know") || 
            answer.toLowerCase().includes("i don't know")) {
          appendMessage("I do not know. Please seek out advice from the nearest healthcare practitioner.", 'bot-message');
        } else {
          appendMessage(answer, 'bot-message');
        }

        // Show retrieved sources (optional, could hide behind a "debug" flag)
        if (data.sources && data.sources.length > 0) {
          let sourcesText = "Sources:\n";
          data.sources.forEach((src, i) => {
            sourcesText += `(${i + 1}) ${src.metadata?.heading || 'Unknown Section'} (Page ${src.metadata?.page || '?'})\n"${src.content}"\n\n`;
          });
          appendMessage(sourcesText.trim(), 'bot-message');
        }

        appendMessage("Do you have any additional questions?", 'bot-message');
        showYesNoOptionsForLLM();
      })
      .catch(err => {
        removeTypingIndicator();
        
        // Detailed error logging
        console.error("LLM API Error:", {
          message: err.message,
          stack: err.stack,
          type: err.name
        });

        // Network error detection
        if (err instanceof TypeError && err.message === 'Failed to fetch') {
          console.error('Network error - server may be down');
          appendMessage("Unable to reach the server. Please check your connection and try again.", 'bot-message');
        } else {
          appendMessage("There was an error processing your request. Please try again.", 'bot-message');
        }
      });
    }
    
  function showTypingIndicator() {
  const existing = document.getElementById('typing-indicator');
  if (existing) return;

  console.log("Adding typing indicator...");

  const chatBox = document.getElementById('chatBox');

  const msg = document.createElement('div');
  msg.className = 'message bot-message typing-indicator';
  msg.id = 'typing-indicator';

  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('div');
    dot.className = 'typing-dot';
    msg.appendChild(dot);
  }

  chatBox.appendChild(msg);

  setTimeout(() => {
    console.log("Typing indicator now shown.");
    msg.classList.add('show'); // This triggers animation
    chatBox.scrollTop = chatBox.scrollHeight;
  }, 10);
}

function removeTypingIndicator() {
  const indicator = document.getElementById('typing-indicator');
  if (indicator) {
    indicator.remove();
  }
}
